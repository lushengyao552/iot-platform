# ============================================================
# 图书管理系统 - Docker Compose 环境
# ============================================================
# 使用方法：
#   1. 安装 Docker Desktop
#   2. 在项目根目录执行: docker-compose up -d
#   3. 等待所有服务启动完成（约 30-60 秒）
#   4. 启动应用: .\backend\mvnw.cmd spring-boot:run
#   5. 停止服务: docker-compose down
# ============================================================

version: '3.8'

services:
  # ============================================================
  # MySQL 8.0 数据库
  # ============================================================
  mysql:
    image: mysql:8.0
    container_name: library-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ll521521
      MYSQL_DATABASE: library_db
      MYSQL_USER: library
      MYSQL_PASSWORD: ll521521
      TZ: Asia/Shanghai
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      # 自动执行初始化脚本（首次启动时）
      - ./backend/src/main/resources/db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
      - --default-authentication-plugin=mysql_native_password
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-pll521521"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - library-network

  # ============================================================
  # Redis 7 缓存
  # ============================================================
  redis:
    image: redis:7-alpine
    container_name: library-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - library-network

  # ============================================================
  # RabbitMQ 3.12 消息队列（带管理界面）
  # ============================================================
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: library-rabbitmq
    restart: unless-stopped
    environment:
      RABBITMQ_DEFAULT_USER: guest
      RABBITMQ_DEFAULT_PASS: guest
      RABBITMQ_DEFAULT_VHOST: /
    ports:
      - "5672:5672"      # AMQP 协议端口（应用连接）
      - "15672:15672"    # 管理界面端口（浏览器访问）
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - library-network

  # ============================================================
  # 可选：通知微服务（独立部署，通过 RabbitMQ 消费消息）
  # ============================================================
  # notification-service:
  #   build: ./backend/notification-service
  #   container_name: library-notification
  #   restart: unless-stopped
  #   depends_on:
  #     rabbitmq:
  #       condition: service_healthy
  #   environment:
  #     SPRING_RABBITMQ_HOST: rabbitmq
  #     SPRING_RABBITMQ_PORT: 5672
  #     SPRING_RABBITMQ_USERNAME: guest
  #     SPRING_RABBITMQ_PASSWORD: guest
  #   networks:
  #     - library-network

# ============================================================
# 数据卷（持久化数据）
# ============================================================
volumes:
  mysql_data:
    driver: local
  redis_data:
    driver: local
  rabbitmq_data:
    driver: local

# ============================================================
# 网络
# ============================================================
networks:
  library-network:
    driver: bridge
