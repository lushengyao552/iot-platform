server:
  port: 8081
  servlet:
    context-path: /api
  encoding:
    charset: UTF-8
    enabled: true
    force: true

spring:
  application:
    name: library-management

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/library_db?useUnicode=true&characterEncoding=utf8&useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true
    username: root
    password: ${DB_PASSWORD:ll521521}
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5

  jackson:
    date-format: yyyy-MM-dd HH:mm:ss
    time-zone: Asia/Shanghai
    default-property-inclusion: non_null

mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.example.library.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl
  global-config:
    db-config:
      id-type: auto
      logic-delete-field: deleted
      logic-delete-value: 1
      logic-not-delete-value: 0

logging:
  level:
    root: INFO
    com.example.library: DEBUG

library:
  jwt:
    secret: ${JWT_SECRET:library-management-secret-key-2024-please-change-in-production}
    expiration: 86400000
    header: Authorization
    prefix: "Bearer "
  borrow:
    max-days: 30
    max-count: 5

knife4j:
  enable: true
  setting:
    language: zh_cn
  production: false
