plugins {
    id 'java'
    id 'org.springframework.boot' version '3.2.5'
    id 'io.spring.dependency-management' version '1.1.4'
}

group = 'com.example'
version = '1.0.0'
sourceCompatibility = '17'
targetCompatibility = '17'

// 仓库配置：阿里云镜像优先，Maven Central 兜底
repositories {
    maven { url 'https://maven.aliyun.com/repository/public' }
    maven { url 'https://maven.aliyun.com/repository/spring' }
    mavenCentral()
}

// Lombok：编译期注解处理，Gradle 需要同时声明 compileOnly 和 annotationProcessor
configurations {
    compileOnly {
        extendsFrom annotationProcessor
    }
}

dependencies {
    // ========== Spring Boot 官方 Starter ==========
    implementation 'org.springframework.boot:spring-boot-starter-web'
    implementation 'org.springframework.boot:spring-boot-starter-validation'
    implementation 'org.springframework.boot:spring-boot-starter-aop'
    implementation 'org.springframework.boot:spring-boot-starter-amqp'
    implementation 'org.springframework.boot:spring-boot-starter-data-redis'

    // ========== 数据持久层 ==========
    runtimeOnly 'com.mysql:mysql-connector-j'
    implementation 'com.baomidou:mybatis-plus-spring-boot3-starter:3.5.5'

    // ========== JWT（接口与实现分离） ==========
    implementation 'io.jsonwebtoken:jjwt-api:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.11.5'
    runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.11.5'

    // ========== 工具类 ==========
    implementation 'cn.hutool:hutool-all:5.8.27'
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    // ========== 接口文档 ==========
    implementation 'com.github.xiaoymin:knife4j-openapi3-jakarta-spring-boot-starter:4.4.0'

    // ========== 测试 ==========
    testImplementation 'org.springframework.boot:spring-boot-starter-test'
}

// JUnit 5 平台
tasks.named('test') {
    useJUnitPlatform()
}

// 打包可执行 jar 的主类
bootJar {
    mainClass = 'com.example.library.LibraryApplication'
}

// 编译编码
tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
}
